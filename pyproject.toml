[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lv24-seo"
version = "0.4.0"
description = "Free-first SEO control plane: Search Console, Yandex, Bing, CrUX, PSI, crawl and weekly diff reports for humans and AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "LV24", email = "paulalexeev10@gmail.com" }]
keywords = ["seo", "mcp", "search-console", "yandex-webmaster", "metrika", "agents", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12.5",
  "httpx>=0.27.2",
  "pydantic>=2.9.2",
  "platformdirs>=4.3.6",
  "mcp>=1.2.0",
  # Windows ships no IANA database for stdlib zoneinfo; without this the
  # scheduler must reject configured zones that cannot be resolved there.
  # MIT-licensed pure-Python data, Windows-only.
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
report = ["jinja2>=3.1.4"]
secrets = ["keyring>=25.4.1"]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "mypy>=1.11.2",
  "types-requests>=2.32.0.20240914",
]

[project.scripts]
lv24-seo = "lv24_seo.cli.main:app"

[project.urls]
Homepage = "https://github.com/LevapVeeskela/lv24-seo-optimizer"
Issues = "https://github.com/LevapVeeskela/lv24-seo-optimizer/issues"
Changelog = "https://github.com/LevapVeeskela/lv24-seo-optimizer/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/lv24_seo"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "lv24_seo_skills"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "SLF001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: hits real provider APIs (needs tokens; never run in CI)",
  "network: hits the public internet (kept out of the default run)",
]
