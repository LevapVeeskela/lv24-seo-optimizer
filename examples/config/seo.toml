# lv24-seo — example `seo.toml`
#
# Copy to the root of your SEO workspace as `seo.toml`. This file is safe to commit:
# it contains *identifiers and preferences only*, never tokens or passwords.
# Secrets come from LV24_SEO_* environment variables, the OS keychain, or a 0600 file
# outside the repository (see docs/config.md § Secrets).
#
# Precedence: CLI flags -> LV24_SEO_* environment -> ./seo.toml -> user config -> defaults.
# Every value below is optional; delete the blocks you do not use.

[project]
name = "example.com"
base_url = "https://example.com"
default_property = "sc-domain:example.com"

[providers.gsc]
# Use the exact property string from Search Console: `sc-domain:example.com` for a
# domain property, `https://example.com/` for a URL-prefix property.
property = "sc-domain:example.com"
# Local default: token in the OS keychain (`lv24-seo auth set --provider gsc --stdin`).
# In CI the workflow passes LV24_SEO_GSC_SERVICE_ACCOUNT_FILE instead.
auth = "keychain"

[providers.yandex_webmaster]
# Never guess the host id: copy it from Webmaster or `lv24-seo properties`.
host_id = "https:example.com:443"

[providers.yandex_metrika]
counter = "123456"
# Goal ids that count as conversions; fetch them once from the Metrika management API.
goals = [1, 2]

[providers.bing]
site = "https://example.com"

[providers.crux]
origin = "https://example.com"

[providers.psi]
strategy = "mobile"
urls = ["https://example.com/", "https://example.com/pricing"]

[report]
locale = "ru"                 # ru | en
timezone = "Europe/Minsk"     # IANA name; all report dates and "today" use it
week_start = "monday"
# Deltas below these thresholds are treated as noise, not as a material change.
thresholds = { clicks_pct = 10, impressions_pct = 15, position_abs = 1.5 }

[report.email]
# enabled/to/smtp_host are the three conditions for SMTP delivery; missing any of them
# disables the email channel ("delivery: no channel configured" if Telegram is also off).
# The password itself is never written here: set LV24_SEO_SMTP_PASSWORD or use keyring.
enabled = true
to = ["owner@example.com"]
from = "seo@example.com"
smtp_host = "smtp.example.com"
smtp_port = 587
smtp_user = "seo@example.com"
# Skip a repeat send when the report digest is unchanged (delivery ledger reason
# `already_sent`). Set to false only for a heartbeat email.
only_on_change = true

[report.telegram]
enabled = true
chat_id = "123456789"
severity = "critical"         # critical | all

[crawl]
max_urls = 500
concurrency = 4
respect_robots = true
user_agent = "lv24-seo/0.1 (+https://example.com/bot)"

[storage]
data_dir = "./data"
raw_retention_days = 90

# [privacy]
# telemetry = false
# ^ Documented in docs/config.md. Current builds have no telemetry at all and reject
#   unknown TOML keys, so this block is left commented out on purpose.
